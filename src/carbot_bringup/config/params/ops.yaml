# =============================================================================
# ops.yaml -- calibration wizard, race supervisor (preflight + START), run
# recorder, system monitor, scoreboard. Step definitions: data/calibration_steps.yaml
# =============================================================================
calibration_wizard:
  ros__parameters:
    session_format: "%Y%m%d_%H%M%S"
    allow_keep_previous: true
    # phase 8
    resume_max_age_h: 12.0          # relaunch within this -> resume the newest UNFINISHED session (0 = always new)
    live_rate_hz: 2.0               # /carbot/calibration/live (open step's live view)
    state_rate_hz: 1.0              # /carbot/calibration/state (also sent on every change)
    tick_hz: 5.0                    # running-step update
    refresh_period_s: 2.0           # re-read summary.yaml (results written by the terminal tools)
    input_timeout_s: 3.0            # SystemHealth / UwbStatus / battery older than this = missing
    restart_cameras:                # step 1 "Restart camera drivers" button
      enabled: true
      kill_patterns: [mipi_cam, hobot_codec, websocket, astra_camera_container]   # camera ones only
      grace_s: 2.0                  # SIGINT, wait, then SIGKILL (kill_stale.sh)
      root_helper_dir: /usr/local/lib/carbot   # = drivers.yaml carbot_launch.root_helper_dir
      delay_mipi_second_s: 2.0      # = drivers.yaml carbot_launch.delay_mipi_second_s
      settle_s: 6.0                 # wait before checking the drivers are still alive
      timeout_s: 20.0               # kill helper time limit
      log_dir: /tmp/carbot_camera_restart

race_supervisor:
  ros__parameters:
    preflight_period_s: 0.5
    camera_min_rate_ratio: 0.8      # >= 80 % of cameras.yaml expected_hz
    camera_max_age_s: 0.5
    lidar_min_hz: 6.0
    lidar_max_age_s: 0.5
    uwb_anchor_max_age_s: 1.0       # every anchor in uwb.yaml must be seen
    battery_min_v: 10.8             # CONFIRM for your pack
    start_position_tolerance_m: 0.20   # UWB (+-20 cm) vs map start pose
    start_heading_tolerance_deg: 15.0
    start_camera_uwb_agreement_m: 0.20
    auto_record: true
    ready_hold_s: 1.0               # all checks green for this long before READY

run_recorder:
  ros__parameters:
    storage_id: sqlite3
    max_bag_size_mb: 2048
    # Explicit list: raw camera images are NOT recorded (use the record streams).
    topics: [/carbot/status, /carbot/mission/state, /carbot/mission/events,
             /carbot/mission/gate_route_mismatch, /carbot/owner/state, /carbot/safety/status,
             /carbot/localization/local_pose, /carbot/localization/global_pose,
             /carbot/localization/status, /carbot/uwb/ranges, /carbot/uwb/status,
             /carbot/uwb/raw_fix, /carbot/plan/corridor, /carbot/plan/local_candidates,
             /carbot/plan/local_path, /carbot/parking/candidates, /carbot/parking/path,
             /carbot/recovery/candidates, /carbot/detections, /carbot/memory/grid,
             /carbot/perception/road_grid, /carbot/race/preflight, /carbot/race/armed,
             /carbot/system/health, /carbot/scoreboard, /carbot/map/track_json,
             /carbot/plan/global_route, /carbot/plan/route_info,
             /carbot/cam/front/record/compressed, /carbot/cam/left_rear/record/compressed,
             /carbot/cam/right_rear/record/compressed,
             /scan, /odom, /imu/rpy, /imu/pitch, /uwb3/input_json, /cmd_vel_auto, /cmd_vel,
             /auto_mode, /e_stop, /tunnel_detected, /tunnel_cmd_vel, /tunnel_debug,
             /carbot/request/road, /carbot/request/tunnel, /carbot/request/parking,
             /carbot/request/recovery, /tf, /tf_static]

system_monitor:
  ros__parameters:
    rate_hz: 1.0
    # Watched topics and expected rates (parallel arrays).
    watch_topics: [/camera/color/image_raw, /cam_ov5647/image_raw, /cam_imx219/image_raw,
                   /scan, /odom, /imu/rpy, /uwb3/input_json, /carbot/perception/road_grid,
                   /carbot/localization/local_pose, /carbot/owner/state,
                   # phase 7 additions (values only, no key renamed)
                   /carbot/localization/global_pose, /carbot/uwb/ranges, /carbot/memory/grid,
                   /carbot/plan/corridor, /carbot/plan/local_path, /carbot/detections,
                   /carbot/safety/status]
    watch_expected_hz: [30.0, 30.0, 30.0, 10.0, 20.0, 20.0, 10.0, 8.0, 50.0, 50.0,
                        10.0, 10.0, 8.0, 5.0, 5.0, 10.0, 50.0]   # corridor/local_path 5 Hz (planning.yaml), safety 50 Hz
    soc_temp_path: /sys/class/thermal/thermal_zone0/temp
    bpu_ratio_path: /sys/devices/system/bpu/bpu0/ratio   # UNVERIFIED on RDK X5: check in phase 7
    camera_process_patterns: [mipi_cam, astra_camera, hobot_codec, websocket]
    uwb_agent_pattern: micro_ros_agent
    # phase 8 (real node; calibration step 1 + race preflight read its output)
    rate_window_s: 2.0              # rate = messages in the last 2 s
    ok_rate_ratio: 0.8              # TopicHealth.ok: rate >= 80 % of expected ...
    max_age_s: 1.0                  # ... and a message within the last 1 s
    latency_max_abs_ms: 60000.0     # |now - header.stamp| above this = driver not on wall clock -> -1
    process_scan_period_s: 2.0
    process_wrapper_names: [sudo, bash, sh, ros2, python3, timeout]   # same cmdline as the driver: not counted
    battery_min_v: 10.8             # SystemHealth.battery_ok (CONFIRM for your pack)
    image_watch_while_armed: false  # race: stop watching camera frames after START (saves CPU)
    discovery_period_s: 2.0         # subscribe watched topics as soon as they appear

scoreboard:
  ros__parameters:
    rate_hz: 2.0
