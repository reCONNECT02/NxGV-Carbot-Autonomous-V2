# =============================================================================
# common.yaml -- parameters every Carbot node receives (`/**` wildcard).
# Vehicle geometry = V4 core.js DEFAULTS (block 01). Metres / seconds / radians
# unless the key says otherwise. Provenance per V4 PROVENANCE: measured vs assumed.
# =============================================================================
/**:
  ros__parameters:
    status_rate_hz: 1.0
    frames:
      track: track
      venue: venue
      odom: odom
      base: base_link
      laser: laser_frame
    vehicle:
      car_length_m: 0.30          # measured
      car_width_m: 0.192          # measured
      wheelbase_m: 0.216          # measured  (base servo_controller.wheel_base is 0.14 -> see base_nodes.yaml)
      rear_overhang_m: 0.042      # assumed
      min_turning_radius_m: 0.40  # assumed, rear axle; measured in calibration step 7
      wheel_radius_m: 0.033       # measured
      wheel_width_m: 0.025        # measured
      mass_kg: 2.0                # assumed
      height_m: 0.24              # rule max 0.25; tunnel clear height 0.27
      steering_lag_s: 0.12        # assumed
      speed_lag_s: 0.18           # assumed
      steering_rate_deg_s: 180.0  # assumed
      lidar_x_m: 0.09             # V4 lidar origin
      lidar_height_m: 0.22
    limits:
      max_speed_mps: 0.18         # V4 maxSpeedCms 18
      parking_speed_mps: 0.06     # V4 parkingSpeedCms 6
      recovery_speed_mps: 0.03    # V4 recovery controller parkingSpeedCms 3
      # V4 lineToleranceCm: training override, NOT a competition permission.
      line_tolerance_m: 0.05
    # phase 4: memory evidence rule for blocks 09 / 10 (V4 guidance.evidence);
    # same values as local_memory.uncertainty_* (block 04 publishes, consumers decide).
    memory_evidence:
      uncertainty_base_m: 0.004
      uncertainty_per_m: 0.006
      uncertainty_limit_m: 0.02
    # UWB 2-D position (Haffiz's method, uwb_localization/positioning.py). Every node
    # that turns UWB ranges into a position reads THIS block: uwb_ranges (block 06
    # input), the calibration wizard (step 10 verify, step 11 UWB lap), tools/uwb,
    # record_lap and the sandbox -> one position, computed one way everywhere.
    # Values = tools/uwb/haffiz/turtle_uwb_visualizer.py. UWB never reaches the servo.
    uwb_positioning:
      solver: linear              # linear (Haffiz) | nlls (Haffiz noEKF, soft_l1) | pairwise (old uwb_xy.py)
      filter: cv_kf               # cv_kf (Haffiz) | moving_average (Haffiz noEKF) | none
      min_anchors: 3              # ranges needed in one report for a fix (2-D)
      skip_repeat_reports: false  # Haffiz: false = solve every report, even if no range is new
      cv_kf:                      # constant-velocity Kalman filter, state [x, y, vx, vy]
        process_noise: 0.2        # Haffiz process_noise (smoothness; lower = smoother, more lag)
        measurement_noise_m: 0.25 # Haffiz measurement_noise (sensor confidence)
        gate_mahalanobis2: 16.0   # Haffiz gate (~4 sigma); a fix above it is ignored
        initial_variance_m2: 1.0  # Haffiz P = eye(4) * 1.0
        reacquire_after_rejects: 30   # NOT Haffiz (0 = his): re-initialise after 30 gated fixes in a row (~3 s)
      moving_average:
        window: 10                # Haffiz noEKF window
      nlls:
        f_scale_m: 1.0            # scipy least_squares soft_l1 scale (Haffiz: default 1.0)
        initial_xy_m: [1.5, 2.5]  # Haffiz noEKF first guess (venue metres)
