# =============================================================================
# localization.yaml -- BLOCK 05 (smooth local pose), BLOCK 06 (coarse UWB-aided
# pose) and the UWB range parser. Values = V4 vehicle.js Estimator + UWB_Handoff
# section 11. Anchor positions/offsets are in data/uwb.yaml, not here.
# Keys marked (bag) are first guesses: re-tune from a recorded run
# (tools/sandbox/run_localization.py --bag ...).
# =============================================================================
local_pose:
  ros__parameters:
    rate_hz: 20.0                   # idle tick: sigma growth when no /odom (pose publishes per /odom msg)
    motion_timeout_s: 0.2           # /odom older than this = "no fresh packet" (V4 idle growth)
    heading_blend: 0.25             # odom.a += 0.25 * wrap(imu_yaw - odom.a)   (V4)
    heading_lead_s: 0.0             # 0 = off (V4). Lead the IMU yaw by yaw_rate(/odom) x this to cancel servo_controller's
                                    # IMU EMA lag (~0.3 s, alpha 0.15): sandbox 15.3 -> ~5 cm rms with 0.3. UNTESTED on the car.
    imu_timeout_s: 0.3              # /imu/rpy older -> heading from /odom yaw increments
    pose_history_s: 2.0             # for registering a camera grid at its own timestamp
    max_stamp_gap_s: 0.15           # grid stamp outside the history by more -> skip it
    max_odom_step_m: 0.10           # one /odom step longer = servo_controller restart; ignored
    heading_sigma_rad: 0.02         # reported heading std-dev (covariance only)
    status_publish_hz: 10.0         # LocalizationStatus -> block 06 + GUI
    publish_tf: true                # track -> base_link (nobody else publishes base_link's parent)
    init:
      source: start_pose            # start_pose (track_map.yaml) | origin
    sigma:
      initial_m: 0.003
      idle_growth_m_per_s: 0.004    # no fresh sensor packet
      per_distance: 0.025
      per_sqrt_s: 0.00025
      floor_m: 0.004
      visual_decay: 0.94
    visual:                         # camera edge -> prior-map boundary registration (V4 visualUpdate)
      enabled: true
      max_radius_m: 0.70
      max_edge_distance_m: 0.045
      gradient_step_m: 0.012
      gradient_norm_min: 0.75
      gradient_norm_max: 1.2
      min_rows: 8
      prior_weight: 0.8
      weight_scale_m: 0.015
      step_cap: 0.12
      step_gain: 0.0015             # max 1.5 mm per frame -> the pose never jumps
      sample_stride: 2
      disable_pitch_rad: 0.045      # pause on steep pitch (hill)
      disable_in_parking: true
    # ICP against the accumulated camera-edge memory (carbot_localization/icp_core.py, docs/LOCALIZATION_MEMORY.md).
    # OFF by default: only the sandbox has seen it (tools/sandbox/run_icp_eval.py); NOT tested on the car.
    # Independent of `visual` (which matches to the prior map): this needs no map, corrects sideways position and
    # HEADING (visual is translation-only), and never lets the estimate jump (per-update + total caps).
    icp:
      enabled: false
      every_n_grids: 4              # registration every 4th road grid (~2 Hz); edge extraction runs on every grid
      max_radius_m: 0.70            # only edge cells this close to the car (same as visual.max_radius_m)
      sample_stride: 2
      max_points: 120               # cap on the current frame's edge points
      normal_k: 8                   # neighbours for each point's local line normal
      memory:                       # V4 guidance.evidence rule: age <= max_age and base + per_m * travel <= limit
        add_every_n_grids: 2
        max_age_s: 2.0                # V4 allows 3 s (local_memory.drive_max_age_s); a NARROW age band keeps the remembered
        min_age_s: 1.0                # lines from fanning out under drift (sandbox: 0.5-3 s corrected 35 % of a heading drift, 1-2 s 62 %)
        max_points: 300             # reference set after voxel thinning
        voxel_m: 0.025
        uncertainty_base_m: 0.004   # = local_memory.uncertainty_*
        uncertainty_per_m: 0.006
        uncertainty_limit_m: 0.02
      max_iter: 10
      pair_max_dist_m: 0.05         # correspondences further apart are outliers
      trim_fraction: 0.8            # keep the best 80 % of the correspondences
      huber_m: 0.01                 # robust residual scale
      min_inliers: 25
      min_inlier_ratio: 0.5
      max_rms_m: 0.012              # fit residual above this = rejected
      min_ref_points: 40
      eig_min_ratio: 0.02           # normal-matrix eigenvalue below this x the largest = unobservable (straight edges: along-track)
      rot_arm_m: 0.30               # makes dtheta comparable with metres in the normal matrix
      max_fit_translation_m: 0.05   # a registration larger than this is implausible: rejected
      max_fit_rotation_rad: 0.05
      gain: 0.5                     # share of the (time-scaled) residual applied per update
      max_step_m: 0.002             # per-update cap (visual.step_gain is 1.5 mm): the pose never jumps
      max_step_rad: 0.001           # 0.057 deg per update (~0.11 deg/s at 2 Hz)
      max_total_m: 0.15             # ICP alone never moves the estimate more than this ...
      max_total_rad: 0.10           # ... or turns it more than 5.7 deg
      min_speed_mps: 0.05           # no update while standing

global_pose:
  ros__parameters:
    rate_hz: 10.0
    initial_variance_m2: 0.0001     # 0.01^2 (V4)
    growth_per_s_m2: 0.000008       # (V4)
    growth_per_m_m2: 0.00002        # (V4)
    max_variance_m2: 1.0            # cap (1 m std-dev)
    # Per-anchor range update (UWB_Handoff section 11): one EKF update per fresh
    # range, each individually innovation-gated.
    range_sigma_m: 0.05             # (bag) raise if too many good ranges are gated
    range_gate_chi2: 6.63           # 1-dof, 99 %
    position_gate_chi2: 13.82       # V4 2-dof 99.9 % (whole-fix mode only)
    fix_sigma_m: 0.05               # whole-fix mode only
    use_per_range_updates: true     # false = V4 whole-fix mode on /carbot/uwb/raw_fix
    skip_repeated_sample_seq: true
    latency_compensation: true      # use each range's estimated measurement time
    visual_landmark_min_rank: 0.25
    visual_landmark_sigma_m: 0.025
    max_uwb_age_s: 1.0
    pose_history_s: 3.0
    require_alignment: true         # no UWB updates until step 11 set track_to_venue.aligned
    publish_venue_tf: true          # static TF track -> venue
    reacquire:                      # NOT in V4: escape a gate lock-out (car misplaced at start)
      reject_streak: 15             # consecutive gated ranges
      inflate_variance_m2: 0.04     # add (0.2 m)^2 once

uwb_ranges:
  ros__parameters:
    link_timeout_s: 1.0
    anchor_timeout_s: 1.0
    expected_rate_hz: 10.0
    max_range_age_ms: 400           # = firmware OMIT_OLDER_THAN_MS
    min_range_m: 0.05
    max_range_m: 30.0
    publish_raw_fix: true           # pairwise trilateration (uwb_xy.py method), GUI/calibration only
    status_publish_hz: 2.0
    latency:
      mode: min_filter              # min_filter | arrival
      window_s: 10.0
      base_transit_ms: 5.0          # assumed one-way delay of the fastest packet
      max_extra_ms: 300.0           # a report later than this -> fall back to arrival time
