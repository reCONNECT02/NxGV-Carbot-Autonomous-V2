# =============================================================================
# localization.yaml -- BLOCK 05 (smooth local pose), BLOCK 06 (coarse UWB-aided
# pose) and the UWB range parser. Values = V4 vehicle.js Estimator + UWB_Handoff
# section 11. Anchor positions/offsets are in data/uwb.yaml, not here.
# =============================================================================
local_pose:
  ros__parameters:
    rate_hz: 50.0
    motion_timeout_s: 0.2
    heading_blend: 0.25             # odom.a += 0.25 * wrap(imu_yaw - odom.a)
    sigma:
      initial_m: 0.003
      idle_growth_m_per_s: 0.004    # no fresh sensor packet
      per_distance: 0.025
      per_sqrt_s: 0.00025
      floor_m: 0.004
      visual_decay: 0.94
    visual:                         # camera edge -> prior-map boundary registration
      enabled: true
      max_radius_m: 0.70
      max_edge_distance_m: 0.045
      gradient_step_m: 0.012
      gradient_norm_min: 0.75
      gradient_norm_max: 1.2
      min_rows: 8
      prior_weight: 0.8
      weight_scale_m: 0.015
      step_cap: 0.12
      step_gain: 0.0015
      sample_stride: 2
      disable_pitch_rad: 0.045      # pause on steep pitch (hill)
      disable_in_parking: true

global_pose:
  ros__parameters:
    rate_hz: 10.0
    initial_variance_m2: 0.0001     # 0.01^2
    growth_per_s_m2: 0.000008
    growth_per_m_m2: 0.00002
    # Per-anchor range update (UWB_Handoff section 11): one EKF update per fresh
    # range, each individually innovation-gated.
    range_sigma_m: 0.05
    range_gate_chi2: 6.63           # 1-dof, 99 %
    position_gate_chi2: 13.82       # V4 2-dof 99.9 % (used for whole-fix mode)
    use_per_range_updates: true
    skip_repeated_sample_seq: true
    latency_compensation: true      # stamp = arrival - age_ms
    visual_landmark_min_rank: 0.25
    visual_landmark_sigma_m: 0.025
    max_uwb_age_s: 1.0

uwb_ranges:
  ros__parameters:
    link_timeout_s: 1.0
    anchor_timeout_s: 1.0
    expected_rate_hz: 10.0
    max_range_age_ms: 400
    min_range_m: 0.05
    max_range_m: 30.0
    publish_raw_fix: true           # pairwise trilateration (uwb_xy.py method), GUI only
