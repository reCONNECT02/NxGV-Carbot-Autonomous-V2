# =============================================================================
# detectors.yaml -- bpu_detector: traffic light, boom gate and signs on the RDK X5
# BPU. Model = team YOLO11n "unified14" (tools/bpu_model/unified14, installed with
# carbot_detectors under models/). What every class triggers: docs/DETECTORS.md.
# The base-repo YOLOv5 model stays at its original path
# (tools/bpu_model/model_output/risabot_signs_640x640_nv12.bin) and is not used.
# =============================================================================
bpu_detector:
  ros__parameters:
    camera_role: front              # the Astra Pro (cameras.yaml roles.front)
    rate_hz: 10.0                   # newest frame only; older frames are dropped
    model_path: models/unified14_yolo11n_640x640_nv12.bin   # relative to the carbot_detectors share dir (or absolute)
    input_width: 640
    input_height: 640
    reg_max: 16                     # YOLO11 DFL bins per box edge
    nms_iou: 0.45
    # Model output order (team unified16.yaml). Changing the model = change BOTH lists.
    class_names: [end_of_tunnel_sign, hill_sign, obstacle_sign, parallel_parking_sign,
                  perpendicular_parking_sign, roundabout_sign, speed_bump_sign,
                  traffic_signals_ahead_sign, tunnel_sign, traffic_red, traffic_yellow,
                  traffic_green, boom_closed, boom_open]
    # Canonical name per model class. "" = ignored (not decoded into detections).
    # Triggers (drive mission states): traffic_light_* and boom_gate_*.
    # Everything else is INFO: shown in the GUI Detections tab and the rosbag, drives nothing.
    # 2026-09-24 (BACKLOG #52): only the traffic light, boom gate and speed bump drive anything, so the
    # 8 INFO-only signs are ignored ("") = no NMS, no publishing, no Detections-tab entries for them.
    # To show them again put the names back:
    #   class_map: [end_of_tunnel_sign, hill_sign, obstacle_sign, parallel_parking_sign,
    #               perpendicular_parking_sign, roundabout_sign, "", traffic_signals_ahead_sign, tunnel_sign,
    #               traffic_light_red, traffic_light_yellow, traffic_light_green, boom_gate_closed, boom_gate_open]
    class_map: ["", "", "", "", "", "",
                "",                         # speed_bump_sign: NOT TRAINED yet (team, phase 6). Map to speed_bump_sign when it is.
                "", "",
                traffic_light_red, traffic_light_yellow, traffic_light_green,
                boom_gate_closed, boom_gate_open]
    # Per-trigger confidence (team laptop-measured operating points).
    thresholds:
      traffic_light_red: 0.25
      traffic_light_yellow: 0.25    # yellow counts as RED for the mission (only GREEN releases)
      traffic_light_green: 0.25
      speed_bump_sign: 0.50
      boom_gate_open: 0.35
      boom_gate_closed: 0.35
    info_threshold: 0.50            # every INFO sign class (team used 0.35-0.50; 0.50 = fewer GUI false alarms)
    debounce_frames: 3              # consecutive frames before a state is reported (team value)
    state_expiry_s: 0.4             # nothing seen for this long -> UNKNOWN
    # Physical sizes for a ROUGH range from the box (only used to tell gates apart).
    # Rulebook p.7/p.9. PROVISIONAL: check on the Detections tab at a known distance.
    object_size_m:
      boom_gate_closed: {width_m: 0.375}    # arm across the lane
      boom_gate_open: {height_m: 0.43}      # 5.5 cm post + 37.5 cm arm, raised
      traffic_light_red: {height_m: 0.196}
      traffic_light_yellow: {height_m: 0.196}
      traffic_light_green: {height_m: 0.196}
    publish_legacy_topics: true     # also /traffic_light_state and /boom_gate_open (nothing in our stack reads them)
    debug:
      enabled: true                 # only encoded while subscribed
      jpeg_quality: 70
      max_rate_hz: 4.0
