# =============================================================================
# drivers.yaml -- BLOCK 02 sensor drivers (values from base bringup.launch.py)
# Cameras are configured in data/cameras.yaml; UWB agent in data/uwb.yaml.
# =============================================================================
ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
    baudrate: 230400
    frame_id: laser_frame
    lidar_type: 1
    device_type: 0
    sample_rate: 4
    support_motor_dtr: true
    intensity: true
    angle_max: 180.0
    angle_min: -180.0
    range_max: 16.0
    range_min: 0.02
    frequency: 10.0
    fixed_resolution: true
    reversion: true
    inverted: true
    auto_reconnect: true
    isSingleChannel: false
    invalid_range_is_inf: false
    abnormal_check_count: 4

joy_node:
  ros__parameters:                  # calibrate mode only (never started in race mode)
    deadzone: 0.12
    autorepeat_rate: 20.0
    coalesce_interval_ms: 1

carbot_tf:
  ros__parameters:
    # base_link -> laser_frame [x, y, z, yaw, pitch, roll]. The V4 model uses x 0.09 z 0.22.
    # MEASURE and set x/z (calibration step 5).
    # phase 5: yaw 0 -> pi. The driver runs with reversion: true (scan angle 0 = car REAR);
    # the base tunnel_wall_follower corrects that with lidar_angle_offset 3.1416. Blocks 10,
    # 12 and 14 read the mount from this TF, so it must say the same.
    base_to_laser: [0.0, 0.0, 0.12, 3.14159265, 0.0, 0.0]

# -----------------------------------------------------------------------------
# carbot_launch -- read by carbot_bringup/stack.py (race + calibrate launches).
# Not a ROS node; kept here so every start-up tunable lives in YAML.
# -----------------------------------------------------------------------------
carbot_launch:
  ros__parameters:
    # calibrate.launch.py calibrate_profile:=lite starts ONLY these Carbot/base nodes (executable names),
    # plus the drivers, TFs, joy, calibration_wizard and gui_server; and loads config/params/calibrate_lite.yaml.
    # Step 13 (practice runs) needs the full profile. Race mode ignores this key.
    calibrate_lite_keep: [road_perception, camera_preview, uwb_ranges, safety_monitor, command_owner,
                          system_monitor, servo_controller]
    # Killed (SIGINT, then SIGKILL) before anything starts. Ctrl+C does not always kill
    # the camera / codec / websocket processes. (mipi_cam was removed 2026-09-24 with the two side
    # cameras; the front Astra is the only camera.)
    # Patterns are matched with `pgrep -f`. The launch that runs the cleanup is
    # protected (ancestor), so an OLDER carbot launch is killed too.
    kill_patterns:
      - launch carbot_bringup
      - hobot_codec
      - websocket
      - astra_camera_container
      - micro_ros_agent
      - ydlidar_ros2_driver_node
      - lib/control_servo/
      - lib/risabot_automode/
      - lib/obstacle_avoidance
      - lib/carbot_
      - joy_node
    kill_grace_s: 2.0
    # Root-owned copies installed by tools/setup/install_root_helpers.sh (preferred:
    # a root-owned script is safe to allow in sudoers). Fallback: package share dir.
    root_helper_dir: /usr/local/lib/carbot
    # Start-up order (seconds after the stale-process cleanup finished).
    delay_base_nodes_s: 2.0       # servo_controller, tunnel_wall_follower
    delay_stack_s: 4.0            # all carbot nodes
    delay_gui_s: 5.0
