# =============================================================================
# cameras.yaml  -- BLOCK 02 cameras (driver config, roles, extrinsics)
#
# Physical sensors follow docs/reference/Camera_Setup.md EXACTLY:
#   OV5647 -> MIPI channel 2 -> /cam_ov5647/image_raw
#   IMX219 -> MIPI channel 0 -> /cam_imx219/image_raw
#   both 960x544 bgr8 ~30 fps; image_width/height ALWAYS set explicitly
#   mipi_cam runs as ROOT (the launch uses the sudo wrapper, see SETUP.md)
# enabled: false = not started, not checked, not used by perception (its role
#   is dropped). Every sensor must have the key.
#
# Calibration writes a copy of this file into the session folder:
#   step 2 -> roles + roles_confirmed(_for) step 3 -> intrinsics_file per sensor
#   step 4 -> mounts (extrinsics) + ipm     step 5 -> lidar_to_camera
# Phase 2 tools: ros2 run carbot_perception calib_intrinsics / calib_extrinsics
# intrinsics_file: absolute path of a ROS camera_info yaml (plumb_bob or
# equidistant = fisheye). It is read by road_perception, NOT passed to mipi_cam.
# =============================================================================
version: 1

sensors:
  astra:
    enabled: true
    driver: astra_camera
    launch_file: astra_mini.launch.py      # base repo launch, reused unchanged
    image_topic: /camera/color/image_raw
    width: 640
    height: 480
    encoding: rgb8
    expected_hz: 30.0
    intrinsics_file: ""                    # calibration step 3
  ov5647:
    enabled: false               # 2026-09-23 risabot5: MIPI frame errors (bndry/seq_frm_fatal), side cameras dropped
    driver: mipi_cam
    namespace: /cam_ov5647
    channel: 2
    image_width: 960
    image_height: 544
    image_topic: /cam_ov5647/image_raw
    encoding: bgr8
    expected_hz: 30.0
    hardware: "OV5647 Rev1.3, MIPI host 2, I2C bus 4, addr 0x36"
    intrinsics_file: ""
  imx219:
    enabled: false               # 2026-09-23 risabot5: not detected on I2C bus 6, side cameras dropped
    driver: mipi_cam
    namespace: /cam_imx219
    channel: 0
    image_width: 960
    image_height: 544
    image_topic: /cam_imx219/image_raw
    encoding: bgr8
    expected_hz: 30.0
    hardware: "IMX219 v2.1, MIPI host 0, I2C bus 6, addr 0x10"
    intrinsics_file: ""

# Role -> sensor. front is always the Astra Pro. Which MIPI camera is left and
# which is right is NOT known for sure: calibration step 2 shows the feeds, the
# user confirms (or swaps), and only then roles_confirmed becomes true.
# Default from the team (phase 2): the OV5647 is the RIGHT camera.
# (Role keys keep the phase-1 names left_rear / right_rear although the MIPI
# cameras now face sideways; renaming them would change topic names.)
roles:
  front: astra
  left_rear: imx219          # UNCONFIRMED default
  right_rear: ov5647         # UNCONFIRMED default
roles_confirmed: false       # race mode refuses to arm while false
# Roles step 2 actually confirmed. Disabled sensors are skipped, so a front-only
# car saves [front]; switching a side camera on later makes its role unconfirmed
# again (carbot_common.data.unconfirmed_roles). Only the wizard writes these two.
roles_confirmed_for: []

# Extrinsics in base_link: rear-axle centre ON THE GROUND, +x fwd, +y left, +z up.
# yaw: 0 = forward, +90 = left. pitch_down: downward tilt. roll: about the optical axis.
# Nominal values = team CAD (phase 2). CAD origin is the rear axle at axle
# height, so z_m = CAD z + 0.0325 (wheel diameter 65 mm / 2).
#   front (Astra RGB lens) CAD (216.992, 11.390, 61.046) mm, 2-3 deg down
#   right (OV5647)         CAD (114.474, -65.360, 108.103) mm, 5 deg back, 10 deg down
#   left  (IMX219)         mirror of right
# Calibration step 4 replaces these with MEASURED mounts (floor boards).
# hfov_deg is only used until step 3 gives real intrinsics (ASSUMED values:
# Astra Pro RGB ~60 deg; MIPI lenses unknown, 70 deg placeholder).
mounts:
  front:      {x_m: 0.2170, y_m:  0.0114, z_m: 0.0935, yaw_deg:   0.0, pitch_down_deg:  2.5, roll_deg: 0.0, hfov_deg: 60.0}
  left_rear:  {x_m: 0.1145, y_m:  0.0654, z_m: 0.1406, yaw_deg:  95.0, pitch_down_deg: 10.0, roll_deg: 0.0, hfov_deg: 70.0}
  right_rear: {x_m: 0.1145, y_m: -0.0654, z_m: 0.1406, yaw_deg: -95.0, pitch_down_deg: 10.0, roll_deg: 0.0, hfov_deg: 70.0}
extrinsics_calibrated: false

# Step 5 result: LiDAR scan points projected into the front camera.
lidar_to_camera:
  calibrated: false
  yaw_offset_deg: 0.0
