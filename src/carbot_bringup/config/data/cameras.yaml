# =============================================================================
# cameras.yaml  -- BLOCK 02 cameras (driver config, roles, extrinsics)
#
# FRONT CAMERA ONLY (decision 2026-09-24): the car has one camera, the Astra Pro colour stream
# (docs/reference/Camera_Setup.md). The two MIPI side cameras (OV5647 on channel 2, the former IMX219
# slot on channel 0) were removed from the whole project: their MIPI data lanes never worked
# (kernel "lane state of host phy is error", `mipi_cam` "grab failed"). Removed here: sensors
# ov5647 + imx219, roles left_rear + right_rear, mounts left_rear + right_rear.
# An OLDER calibration session's copy of this file may still list them: they are ignored
# (carbot_common.topics.CAMERA_ROLES = front only; sensors that no role names are never started).
# enabled: false = not started, not checked, not used by perception. Every sensor must have the key.
#
# Calibration writes a copy of this file into the session folder:
#   step 2 -> roles + roles_confirmed(_for) step 3 -> intrinsics_file per sensor
#   step 4 -> mounts (extrinsics) + ipm     step 5 -> lidar_to_camera
# Phase 2 tools: ros2 run carbot_perception calib_intrinsics / calib_extrinsics
# intrinsics_file: absolute path of a ROS camera_info yaml (plumb_bob or
# equidistant = fisheye). It is read by road_perception.
# =============================================================================
version: 1

sensors:
  astra:
    enabled: true
    driver: astra_camera
    # 2026-09-24 (BACKLOG #48): colour only. astra_rgb.launch.py drops the depth/IR streams, D2C
    # alignment, point clouds and camera TF that astra_mini.launch.py ran (astra_camera_container was
    # 67 % of a core). Old behaviour: launch_package astra_camera, launch_file astra_mini.launch.py,
    # no launch_args. launch_args = sensor keys below handed to the launch as key:=value.
    launch_package: carbot_bringup
    launch_file: astra_rgb.launch.py
    launch_args: [width, height, fps]
    image_topic: /camera/color/image_raw
    width: 640                             # 2026-09-24: 640x480 (was 320x240): step 4 board detection needs it (BACKLOG #54).
    height: 480                            # Intrinsics/extrinsics belong to THIS size: redo steps 3 and 4 after a change.
    fps: 15                                # was 30
    encoding: rgb8
    expected_hz: 15.0
    intrinsics_file: ""                    # calibration step 3

# Role -> sensor. front is the Astra Pro (the only role, topics.CAMERA_ROLES). Calibration step 2
# shows the feed and the user confirms it; only then roles_confirmed becomes true.
roles:
  front: astra
roles_confirmed: false       # race mode refuses to arm while false
# Roles step 2 actually confirmed: [front]. Only the wizard writes these two.
roles_confirmed_for: []

# Extrinsics in base_link: rear-axle centre ON THE GROUND, +x fwd, +y left, +z up.
# yaw: 0 = forward, +90 = left. pitch_down: downward tilt. roll: about the optical axis.
# Nominal values = team CAD (phase 2). CAD origin is the rear axle at axle
# height, so z_m = CAD z + 0.0325 (wheel diameter 65 mm / 2).
#   front (Astra RGB lens) CAD (216.992, 11.390, 61.046) mm, 2-3 deg down
# Calibration step 4 replaces these with MEASURED mounts (floor boards).
# hfov_deg is only used until step 3 gives real intrinsics (ASSUMED value: Astra Pro RGB ~60 deg).
mounts:
  front:      {x_m: 0.2170, y_m:  0.0114, z_m: 0.0935, yaw_deg:   0.0, pitch_down_deg:  2.5, roll_deg: 0.0, hfov_deg: 60.0}
extrinsics_calibrated: false

# Step 5 result: LiDAR scan points projected into the front camera.
# yaw_offset_deg = correction step 5 found and ALREADY APPLIED to the overlay's
# carbot_tf.base_to_laser yaw and tunnel_wall_follower.lidar_angle_offset: a record,
# never add it again. The session copy also gets base_to_laser, max_residual_deg, n_captures.
lidar_to_camera:
  calibrated: false
  yaw_offset_deg: 0.0
