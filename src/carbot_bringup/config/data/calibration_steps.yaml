# =============================================================================
# calibration_steps.yaml -- the guided calibration wizard (calibrate.launch.py)
#
# Steps run IN ORDER. A step cannot be skipped until it passes, unless the user
# picks "keep previous value" (only offered when a previous session has a PASS
# for that step). Each result is written to:
#   <data_root>/calibration/<YYYYmmdd_HHMMSS>/<NN>_<id>.yaml
# plus summary.yaml (pass/fail per step) and, when relevant, params_overlay.yaml
# (ROS parameter overrides) and data-file copies (cameras.yaml, uwb.yaml).
# <data_root>/calibration/ACTIVE holds the session race mode loads. Older
# sessions are never deleted, so the user can roll back.
#
# tab: diagnostic tab shown live next to the instructions.
# writes: which files/keys the step produces.
# =============================================================================
version: 1
steps:
  - index: 1
    id: sensor_health
    title: Sensor health check
    required: true
    tab: health
    writes: [summary only]
    # Wizard page (phase 8). Reads what system_monitor, uwb_ranges and the servo_controller
    # extension already publish; subscribes to nothing extra.
    instructions:
      - Power on the car (battery switch ON), all three UWB anchors and the UWB tag.
      - Wait until every row in the table turns green (about 10 s after the launch).
      - "If a row stays red, read its Why / Fix. For a camera or duplicate-process row, press
         Restart camera drivers."
      - Press Run check (it measures for a few seconds), then Save.
    procedure: {measure_s: 5.0, min_samples: 3, min_ok_fraction: 0.8}
    pass: {camera_rate_min_ratio: 0.8, lidar_min_hz: 6.0, odom_min_hz: 15.0, imu_min_hz: 15.0, uwb_min_hz: 7.0,
           battery_min_v: 10.8,
           # phase 8 additions
           max_age_s: 1.0,           # every sensor must have published within this
           processes: {mipi_pattern: mipi_cam, astra_pattern: astra_camera,   # exactly one each
                       forbidden: [hobot_codec, websocket]}}                  # old one-camera viewer
  - {index: 2,  id: camera_identity,   title: Camera identity (front / left / right), required: true, tab: perception,
     writes: [cameras.yaml roles, cameras.yaml roles_confirmed],
     pass: {user_confirmed: true}}
  - {index: 3,  id: camera_intrinsics, title: Camera intrinsics (per camera), required: true, tab: perception,
     writes: [intrinsics/<sensor>.yaml (ROS camera_info format), cameras.yaml sensors.*.intrinsics_file],
     per_sensor: [astra, ov5647, imx219],
     tool: ros2 run carbot_perception calib_intrinsics --sensor <sensor>,
     target: {type: chessboard, inner_corners: [9, 6], square_m: 0.025},
     pass: {min_views: 15, max_reprojection_px: 0.8, min_coverage_cells: 9}}
  - {index: 4,  id: extrinsics_ipm,    title: 3-camera extrinsics + IPM,     required: true,  tab: perception,
     writes: [cameras.yaml mounts, cameras.yaml extrinsics_calibrated],
     tool: ros2 run carbot_perception calib_extrinsics,
     # Floor chessboards (tools/calibration/make_boards.py -> A3 PDF, 6x4 inner
     # corners, 50 mm squares, 350 x 250 mm). centre_m = centre of the printed board in base_link
     # (rear-axle centre on the ground); yaw_deg = direction of the board's long
     # side. Defaults are where the CAD mounts should see each board fully; if a
     # board is cut off, move it and MEASURE the new centre.
     # Alternative: make_boards.py --sheet -> docs/calibration/floor_sheet.pdf,
     # all boards on ONE large print at exactly these positions (no measuring).
     # After editing centre_m / yaw_deg, regenerate and reprint the sheet.
     target: {type: floor_markers, layout: docs/images/calib_mat.png,
              warn_nominal_offset_m: 0.03, warn_nominal_angle_deg: 5.0,
              boards: [
                {name: front, roles: [front],      inner_corners: [6, 4], square_m: 0.050, centre_m: [0.62, 0.0],   yaw_deg: 90.0},
                {name: left,  roles: [left_rear],  inner_corners: [6, 4], square_m: 0.050, centre_m: [0.10, 0.47],  yaw_deg: 0.0},
                {name: right, roles: [right_rear], inner_corners: [6, 4], square_m: 0.050, centre_m: [0.10, -0.47], yaw_deg: 0.0}]},
     pass: {max_ground_error_m: 0.02, max_seam_error_m: 0.03}}
  - {index: 5,  id: lidar_camera,      title: LiDAR-camera alignment,        required: true,  tab: memory_lidar,
     writes: [cameras.yaml lidar_to_camera, params_overlay tunnel_wall_follower.lidar_angle_offset],
     pass: {max_bearing_error_deg: 2.0}}
  - index: 6
    id: imu_odometry
    title: IMU + wheel odometry
    required: true
    tab: localization
    tool: ros2 run carbot_localization calib_odometry
    writes: [params_overlay servo_controller.ticks_per_meter, servo_controller.odom_reverse_polarity,
             servo_controller.imu_yaw_scale]
    instructions:
      - Put two tape marks exactly 2.00 m apart on a straight, flat part of the floor.
      - "Distance test: rear axle on the first mark, push the car straight to the second.
         If the distance is wrong the tool corrects ticks_per_meter (or the encoder
         direction) live and asks for a verify run."
      - "Drift test: hands off, car still for 60 s."
      - "Spin test: line the car up with a tape mark, turn it by hand ONE full turn to the
         LEFT (counter-clockwise seen from above) back onto the mark. Fixes the IMU yaw
         sign and scale (block 05 needs yaw to increase turning left)."
    procedure: {straight_run_m: 2.0, spin_test: true, drift_test_s: 60, max_runs: 4}
    pass: {max_distance_error_pct: 2.0, max_heading_drift_deg_per_min: 2.0, max_spin_error_pct: 3.0}
  - index: 7
    id: servo_steering
    title: Servo centre + steering limits
    required: true
    tab: control
    tool: ros2 run carbot_control calib_steering
    instructions: >-
      The car drives ITSELF slowly through the command owner (calibrate mode only):
      clear flat floor of about 1.5 x 2.5 m, e-stop ready. It drives a full-LEFT
      circle and a full-RIGHT circle until the IMU has turned circle_yaw_deg (radius
      each side), then straight runs of straight_run_m; the residual curve sets the
      integer servo_center live until the drift passes. If the servo strains or buzzes
      at full lock, lower servo_range_left / right in the Tuning tab and redo.
      Needs step 6 (IMU yaw) first.
    # writes command_owner.steering (+ the tunnel_bridge copy); servo_range_* stay as set
    writes: [params_overlay servo_controller.servo_center, command_owner.steering.*, tunnel_bridge.command_owner_steering.*, vehicle.min_turning_radius_m]
    procedure: {raw_duty: 0.16, circle_yaw_deg: 180, circle_max_distance_m: 2.2, straight_run_m: 1.5, max_runs: 4, timeout_s: 25}
    pass: {straight_drift_m_per_m: 0.02, min_radius_m_max: 0.45}
  - index: 8
    id: speed_pid
    title: Speed PID
    required: true
    tab: control
    tool: ros2 run carbot_control calib_speed
    instructions: >-
      The car drives ITSELF straight, forward and back alternately (about 1.5 m free
      ahead and behind), e-stop ready. A duty sweep fits the feedforward (duty =
      static + per_mps * speed), then closed-loop steps check steady error and
      overshoot, retuning kp / ki if needed. Needs step 7 first.
    writes: [params_overlay command_owner.speed_pid.*, command_owner.feedforward.*, tunnel_bridge.command_owner_feedforward.*]
    procedure: {sweep_duties: [0.06, 0.08, 0.10, 0.12, 0.15, 0.18, 0.22], step_targets_mps: [0.03, 0.075, 0.15], hold_s: 3.0, steady_s: 1.0, max_runs: 3}
    pass: {max_steady_error_mps: 0.01, max_overshoot_pct: 20.0, min_creep_speed_mps: 0.03}
  - {index: 9,  id: venue_thresholds,  title: Venue colour / lighting thresholds, required: true, tab: perception,
     writes: [params_overlay road_perception.classify.*, bpu_detector.thresholds.*],
     pass: {min_road_coverage: 0.5, max_false_paint_ratio: 0.05, tunnel_dark_check: true}}
  - index: 10
    id: uwb_survey
    title: UWB anchor survey + uwb_calib offsets
    required: true
    tab: localization
    tool: ros2 run uwb_localization calib_uwb
    writes: [uwb.yaml anchors, uwb.yaml tag.z_m, uwb.yaml tag.mount_xy_m, uwb.yaml anchors_surveyed,
             uwb.yaml offsets_calibrated]
    instructions:
      - "LAYOUT: spread the anchors 2-7 m apart in a triangle around the track (current
         layout: 1782 (0, 0), 1786 (7.50, 0), 1783 (7.50, 4.83), metres). Never nearly in a line."
      - "HEIGHT: raise every anchor to 1.0-1.5 m on a stand with clear line of sight to the whole
         track. Anchors on the floor cause the ~25 cm flip-flop seen in testing."
      - "4th ANCHOR (optional, covers the corner at (0, 4.83) outside the triangle): add its ID to
         ANCHOR_IDS and set ANCHOR_COUNT 4 in firmware/uwb_tag/TagMicroROS/RangeProtocol.h,
         re-flash the tag, then add it when the tool asks for anchors."
      - "SURVEY: tape-measure every anchor antenna (x, y, height) in METRES from anchor 1782,
         +x towards 1786, +y from 1786 towards 1783. Enter them when asked."
      - "TAG: measure the tag antenna on the car: height above the floor, and its position from
         the rear-axle centre (forward +x, left +y)."
      - "OFFSETS: put the tag still at a tape-measured spot inside the triangle, more than 1 m from
         every anchor, antenna as on the car, nobody in the line of sight (20 s)."
      - "VERIFY: move it to a DIFFERENT measured spot (20 s). The corrected fix must be within 15 cm."
    procedure: {tool: tools/uwb/uwb_calib.py method (calib_uwb), seconds: 20, min_distance_from_anchor_m: 1.0,
                verify_spot: true, link_check_s: 5, min_samples: 20, min_spacing_m: 2.0,
                min_triangle_angle_deg: 25.0, hdop_limit: 2.0, max_spread_m: 0.08}
    pass: {max_verify_error_m: 0.15, all_anchors_seen: true, min_hdop_coverage: 0.9}
  - index: 11
    id: map_uwb_alignment
    title: Map-to-UWB alignment lap
    required: true
    tab: map
    tool: ros2 run carbot_localization calib_map_uwb
    writes: [uwb.yaml track_to_venue]
    instructions:
      - Needs steps 4, 6 and 10 done (block 05 must hold the lane; UWB offsets applied).
      - "LAP (best): put the car on the map start pose (bottom-right lane, facing west), press
         Enter, then push or drive it SLOWLY once around the whole track and press Enter."
      - "POINTS (quick, competition day): park the car on 2 or more known map poses far apart
         (start, traffic-light stop, ...) for 10 s each."
      - The fit uses every range directly; check the RMS and that the planned route overlays the
        track on the Global map tab.
    procedure: {drive: slow_manual_lap, mode: calibrate_only, modes: [lap, points], lap_min_s: 40,
                min_extent_m: 3.0, huber_m: 0.10, inlier_m: 0.25, points_seconds: 10, min_points: 2}
    pass: {max_rms_m: 0.20, min_inlier_frac: 0.8}
  # phase 8: step 12 inserted (agreed 13-step wizard). Routes and roundabout exits are planned
  # on the saved map. required: false UNTIL its wizard page exists, otherwise race mode could
  # never arm (no page = no way to pass it). Set true when the page is built.
  - index: 12
    id: mission_planner
    title: Mission planner (route + roundabout exits)
    required: false
    tab: map
    tool: python3 tools/map/mission_planner.py
    writes: [mission.yaml]
    instructions:
      - Needs step 11 saved. Routes and roundabout exits are planned on that exact map.
      - Place P0 (start), P1, P2 (parking) and P3 (finish); every car pose must be fully on the road.
      - Check all routes and their roundabout exits, then save the mission.
    pass: {}
  - {index: 13, id: practice_runs,     title: Per-challenge practice runs (optional), required: false, tab: scoreboard,
     writes: [practice/<challenge>.yaml],
     pass: {}}
