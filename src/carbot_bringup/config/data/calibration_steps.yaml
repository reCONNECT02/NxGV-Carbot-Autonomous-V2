# =============================================================================
# calibration_steps.yaml -- the guided calibration wizard (calibrate.launch.py)
#
# Steps run IN ORDER. A step cannot be skipped until it passes, unless the user
# picks "keep previous value" (only offered when a previous session has a PASS
# for that step). Each result is written to:
#   <data_root>/calibration/<YYYYmmdd_HHMMSS>/<NN>_<id>.yaml
# plus summary.yaml (pass/fail per step) and, when relevant, params_overlay.yaml
# (ROS parameter overrides) and data-file copies (cameras.yaml, uwb.yaml).
# <data_root>/calibration/ACTIVE holds the session race mode loads. Older
# sessions are never deleted, so the user can roll back.
#
# tab: diagnostic tab shown live next to the instructions.
# writes: which files/keys the step produces.
# =============================================================================
version: 1
steps:
  - index: 1
    id: sensor_health
    title: Sensor health check
    required: true
    tab: health
    writes: [summary only]
    # Wizard page (phase 8). Reads what system_monitor, uwb_ranges and the servo_controller
    # extension already publish; subscribes to nothing extra.
    instructions:
      - Power on the car (battery switch ON), all three UWB anchors and the UWB tag.
      - Wait until every row in the table turns green (about 10 s after the launch).
      - "If a row stays red, read its Why / Fix. For a camera or duplicate-process row, press
         Restart camera drivers."
      - Press Run check (it measures for a few seconds), then Save.
    # live_smooth_n: the live table shows a row red only when it failed in the majority of the
    # last N system_monitor reports (1 = no smoothing). Run uses min_ok_fraction instead.
    procedure: {measure_s: 5.0, min_samples: 3, min_ok_fraction: 0.8, live_smooth_n: 3}
    pass: {camera_rate_min_ratio: 0.8, lidar_min_hz: 6.0, odom_min_hz: 15.0, imu_min_hz: 15.0, uwb_min_hz: 7.0,
           battery_min_v: 10.8,
           # phase 8 additions
           max_age_s: 1.0,           # every sensor must have published within this
           # false: the *_min_hz / camera_rate_min_ratio limits above are shown, not enforced
           # (2026-09-23: system_monitor under-counts on a loaded RDK, Astra 18.9 Hz vs 30 Hz real).
           # "never published" and "stale > max_age_s" still fail.
           enforce_min_rates: false,
           processes: {astra_pattern: astra_camera,   # exactly one
                       forbidden: [hobot_codec, websocket]}}                  # old one-camera viewer
  # Step 2: the user confirms each ENABLED camera shows the view its role says
  # (cameras.yaml sensors.<name>.enabled: false -> role skipped, e.g. front-only).
  # Confirm = RUN: the enabled image topics must stay live for measure_s (a
  # confirmation of a frozen picture means nothing). Save writes the session's
  # data/cameras.yaml roles, roles_confirmed, roles_confirmed_for.
  - index: 2
    id: camera_identity
    title: Camera identity (front / left / right)
    required: true
    tab: perception
    writes: [cameras.yaml roles, cameras.yaml roles_confirmed, cameras.yaml roles_confirmed_for]
    need: Step 1 passed. Camera drivers running (step 1 has a Restart camera drivers button).
    instructions:
      - Stand in front of the car and wave a hand about 50 cm ahead of the front bumper.
      - The FRONT picture must show your hand straight ahead. If it shows the side or the back, stop and fix the camera mounting or cabling.
      - Press Confirm. The front picture must keep streaming for a few seconds.
      - Press Save. It writes the roles into this session (they apply from the next launch of this session).
    procedure: {measure_s: 3.0, min_samples: 2, min_ok_fraction: 0.8}
    pass: {user_confirmed: true, max_image_age_s: 2.0}   # was 1.0; loosened 2026-09-24, images were 1.2 s old under load (BACKLOG #42)
  - index: 3
    id: camera_intrinsics
    title: Camera intrinsics (front camera)
    required: true
    tab: perception
    # Wizard page (phase 8): one camera per Run, cameras with cameras.yaml enabled: false are
    # shown as not detected and do not count. Same math as the terminal tool below.
    writes: [intrinsics/<sensor>.yaml (ROS camera_info format), cameras.yaml sensors.*.intrinsics_file]
    per_sensor: [astra]
    tool: ros2 run carbot_perception calib_intrinsics --sensor <sensor>
    instructions:
      - "Print docs/calibration/intrinsics_board_A4.pdf at 100 % (9 x 6 inner corners, 25 mm squares) and tape it flat to a stiff board."
      - Choose the camera below and press Run.
      - "Hold the whole board in view and keep it still for a moment: a view is captured automatically. Then move it somewhere new."
      - "Cover every part of the image (the 3 x 3 grid turns green), near the edges and corners too, at different distances and tilts."
      - "It calibrates by itself once enough views are collected, then press Save."
    target: {type: chessboard, inner_corners: [9, 6], square_m: 0.025}
    # 2026-09-24: loosened for hand-held capture on the loaded RDK (was extra_views 10, timeout 300,
    # novelty 0.12, still_px 1.5); BACKLOG #44
    procedure: {extra_views: 3,           # capture min_views + this before fitting
                capture_timeout_s: 600.0, # fit whatever was collected by then
                novelty: 0.07,            # how different a new view must be (calib_core.ViewCollector)
                still_px: 3.0,            # max corner motion between frames to count as still
                max_live_corners: 54}     # corners sent to the page overlay
    pass: {min_views: 15, max_reprojection_px: 0.8, min_coverage_cells: 9}
  - {index: 4,  id: extrinsics_ipm,    title: Front camera extrinsics + IPM,     required: true,  tab: perception,
     need: "Step 3 passed and saved (at the current image size, 640x480). Put the car on the floor sheet so the printed board is fully visible to the front camera.",
     instructions: ["Print the floor sheet at 100% and align the rear axle and car centre line with its marks (the axle line is 65 mm further back relative to the boards than on the first sheet: axle_offset_m).",
                    "Check the front camera picture: the floor board must be flat, fully visible and still.",
                    "Press Run. It captures a fresh front picture, finds the board and solves the camera mount. On the RDK this takes about 10-40 s: wait until the page shows a result.",
                    "Read any error, adjust the board or the camera, and press Redo. Save only after all checks pass."],
     procedure: {capture_timeout_s: 20.0},
     writes: [cameras.yaml mounts, cameras.yaml extrinsics_calibrated],
     tool: ros2 run carbot_perception calib_extrinsics,
     # Floor chessboard (tools/calibration/make_boards.py -> A3 PDF, 6x4 inner
     # corners, 50 mm squares, 350 x 250 mm). centre_m = centre of the printed board on the
     # layout, measured from the layout's reference line (the rear-axle line when axle_offset_m is
     # 0); yaw_deg = direction of the board's long side. Defaults are where the CAD mounts should
     # see each board fully; if a board is cut off, move it and MEASURE the new centre.
     # axle_offset_m (2026-09-24, BACKLOG #54): the car's REAR AXLE sits this far BEHIND the reference
     # line (the front camera did not see its whole board), so in base_link (origin = rear-axle
     # centre on the ground, +x forward) every board is axle_offset_m FURTHER FORWARD:
     #   base_link x = centre_m[0] + axle_offset_m   (y and yaw unchanged; 0.0 = as first printed).
     # carbot_common.calib_tools.floor_board_dicts applies it for the solver, the sheet and the
     # picture. The sheet's boards stay where they are: only the axle line / car outline move.
     # Alternative: make_boards.py --sheet -> docs/calibration/floor_sheet.pdf,
     # the board on ONE print at exactly this position, with the car outline, centre line and axle line.
     # After editing centre_m / yaw_deg / axle_offset_m, regenerate and reprint the sheet.
     target: {type: floor_markers, layout: docs/images/calib_mat.png,
              warn_nominal_offset_m: 0.03, warn_nominal_angle_deg: 5.0,
              axle_offset_m: 0.065,      # 2026-09-24: 0.150 -> 0.065 (at 0.150 the front board was not detected)
              # Vertical stretch factors tried, in order, when the board is not found as is: the board is seen
              # from ~9 cm above the floor, so its rows are only 10-20 px apart and the detector gives up
              # (BACKLOG #54). [] = never stretch. cv2.findChessboardCornersSB is not repeatable (the same
              # 640x480 frame at x2.0 succeeded 19 of 20 times), so the best factor is listed three times.
              detect_vertical_stretch: [2.0, 2.0, 2.0, 1.5, 2.5, 3.0],
              boards: [
                # 2026-09-24: front camera only (the side cameras are removed from the project), one board.
                # Removed with the side cameras (put back together with their roles in cameras.yaml):
                #   left  [left_rear]  centre_m [0.10,  0.47] yaw 0     right [right_rear] centre_m [0.10, -0.47] yaw 0
                {name: front, roles: [front],      inner_corners: [6, 4], square_m: 0.050, centre_m: [0.62, 0.0],   yaw_deg: 90.0}]},
     pass: {max_ground_error_m: 0.02, max_seam_error_m: 0.03}}
  - index: 5
    id: lidar_camera
    title: LiDAR-camera alignment
    required: true
    tab: memory_lidar
    # phase 8: + carbot_tf.base_to_laser (the static TF must carry the same yaw as
    # lidar_angle_offset; the launch reads it from the session overlay on the next start)
    writes: [cameras.yaml lidar_to_camera, params_overlay tunnel_wall_follower.lidar_angle_offset,
             params_overlay carbot_tf.base_to_laser]
    # Wizard page (phase 8). A target is clicked in the front image; the LiDAR cluster
    # nearest to where that ray hits the floor is compared by bearing from the LiDAR
    # (carbot_ops/lidar_align.py). Uses the front camera from steps 3/4 only.
    need: "One thin upright target taller than the LiDAR (a bottle, can or pole, 3-12 cm wide, > 25 cm tall),
           a clear floor about 1.5 m in front of the car, and a tape measure for the LiDAR position (optional)."
    instructions:
      - Car on the floor, still, nothing but the target within 1.5 m in front of it.
      - Stand the target 0.4-1.2 m ahead, inside the front camera view. It shows as a ringed LiDAR target.
      - Click exactly where the target touches the floor in the camera image, then press Capture.
      - Move the target (left side, middle, right side of the view) and capture again. At least 3 positions.
      - Optionally type the measured LiDAR x / height, press Compute, then Save. Relaunch to apply.
    procedure: {roi_min_m: 0.25, roi_max_m: 1.6,       # target search area: distance from the LiDAR
                cluster_gap_m: 0.05, min_cluster_points: 3, max_cluster_width_m: 0.15,
                match_max_m: 0.25,                     # clicked floor point -> LiDAR cluster (~17 deg at 0.8 m)
                scan_max_age_s: 0.5, capture_scans: 5,  # a capture averages the last 5 scans
                min_captures: 3, min_spread_deg: 20.0, # bearing spread (base_link) of the captures
                overlay_max_points: 400,               # scan points drawn into the live image
                mount_x_range_m: [-0.10, 0.40], mount_z_range_m: [0.02, 0.40],   # sanity for typed values
                reload_period_s: 2.0}                  # re-read cameras.yaml / TF from the session
    pass: {max_bearing_error_deg: 2.0,                 # largest per-capture residual after the correction
           max_correction_deg: 10.0,                   # larger = wrong mount/reversion, not a calibration
           warn_range_diff_m: 0.08}                    # LiDAR vs camera distance: warning only
  # Step 6 (wizard page, phase 8): the car is pushed / turned BY HAND, the motors are never
  # driven. Distance + spin are page operations, Run = the drift test, which finishes the step.
  # Corrections are set LIVE on servo_controller (a corrected run never passes: the next run
  # verifies it). Save writes the three values into this session's params_overlay.yaml.
  - index: 6
    id: imu_odometry
    title: IMU + wheel odometry
    required: true
    tab: localization
    tool: ros2 run carbot_localization calib_odometry
    writes: [params_overlay servo_controller.ticks_per_meter, servo_controller.odom_reverse_polarity,
             servo_controller.imu_yaw_scale]
    need: Steps 1-5 passed. calibrate.launch.py running (servo_controller publishes /odom and /imu/rpy). Car on the floor; you move it by hand.
    instructions:
      - Put two tape marks exactly 2.00 m apart on a straight, flat part of the floor.
      - "DISTANCE: turn Manual control ON in the GUI header, put the rear axle on the first mark, press
         Start distance run, DRIVE the car slowly with the joystick straight to the second mark, press
         Stop, then turn Manual control OFF. Do NOT pull the car by hand: the wheel encoder gives wrong
         counts when the wheel is turned by hand (risabot5, 2026-09-24: hand-pulled runs gave 293103
         ticks/m, motor-driven about 13000). If the distance is wrong the page corrects
         ticks_per_meter (or the encoder direction) live: do one more run to verify."
      - "SPIN: line the car up with a tape mark, press Start spin, turn it by hand ONE full turn
         to the LEFT (counter-clockwise seen from above) back onto the mark, press Stop. Fixes
         the IMU yaw sign and scale (block 05 needs yaw to increase turning left)."
      - "DRIFT: hands off, press Run drift test: the car must stay completely still for 60 s."
      - Press Save. It writes ticks_per_meter, odom_reverse_polarity and imu_yaw_scale into this session.
    # phase 8 page: min_rate_hz = /odom and /imu/rpy messages per second a run needs;
    # distance_min_fraction was 0.2 until 2026-09-24: with a wrong ticks_per_meter the odometry counted ~10 % of the
    # tape (risabot5 read 0.2 m for 2.00 m), every run was rejected as "wheel not turning" and NOTHING was ever
    # corrected. 0.02 = 4 cm of 2 m: below that the wheel really is not turning (or the encoder is dead).
    # distance_min_fraction / spin_min_fraction = below this share of the tape distance / a full
    # turn nothing is corrected (wheel not turning, turn not finished); settle_s = IMU samples
    # ignored after imu_yaw_scale changes for the spin. max_runs = runs listed on the page.
    procedure: {straight_run_m: 2.0, spin_test: true, drift_test_s: 60, max_runs: 4,
                min_rate_hz: 5.0, distance_min_fraction: 0.02, spin_min_fraction: 0.5, settle_s: 0.5}
    pass: {max_distance_error_pct: 2.0, max_heading_drift_deg_per_min: 2.0, max_spin_error_pct: 3.0}
  # Step 7 (wizard page, phase 8): Run starts a supervised drive, the car waits at a Go
  # button before EVERY segment (left circle, right circle, straight runs) so it can be
  # put back on clear floor. Cancel / STOP MOTORS stop it at once.
  - index: 7
    id: servo_steering
    title: Servo centre + steering limits
    required: false      # 2026-09-25 risabot1: owner skips it (steering min/max typed in the GUI Steering test tab; full-lock circles slip the belt)
    tab: control
    tool: ros2 run carbot_control calib_steering
    need: Step 6 passed (the IMU yaw measures the circles). calibrate.launch.py running. Clear flat floor about 1.5 x 2.5 m, e-stop ready.
    instructions:
      - "The car drives ITSELF slowly through the command owner (calibrate mode only). Clear flat
         floor of about 1.5 x 2.5 m, e-stop ready. Press Run."
      - "LEFT circle: put the car on the clear floor and press Go. It drives at full LEFT lock
         until the IMU has turned circle_yaw_deg."
      - "RIGHT circle: move the car back if needed, press Go. If the servo strains or buzzes
         at full lock, Cancel, lower servo_range_left / right in the Tuning tab and Redo."
      - "STRAIGHT runs: line the car up with straight_run_m free ahead, press Go. The residual
         curve sets the integer servo_center live; repeat Go until the drift passes."
      - Press Save. It writes servo_center, the command owner steering limits and min_turning_radius_m into this session.
    # writes command_owner.steering (+ the tunnel_bridge copy); servo_range_* stay as set
    writes: [params_overlay servo_controller.servo_center, command_owner.steering.*, tunnel_bridge.command_owner_steering.*, vehicle.min_turning_radius_m]
    # phase 8 page: stop_settle_s = speed-0 requests after each segment (as calib_drive);
    # imu_settle_s = IMU samples ignored after imu_yaw_scale is set to +-1 for the measurement;
    # odom_timeout_s = /odom older than this while driving aborts the segment.
    procedure: {raw_duty: 0.16, circle_yaw_deg: 180, circle_max_distance_m: 2.2, straight_run_m: 1.5, max_runs: 4, timeout_s: 25,
                stop_settle_s: 0.8, imu_settle_s: 0.5, odom_timeout_s: 0.5,
                # stall boost (2026-09-24, BACKLOG #63): the car did not move at raw_duty 0.16. While the odometry
                # moves less than stall_min_progress_m per stall_window_s (after stall_grace_s), the duty goes up
                # by stall_boost_step, never above stall_boost_max_duty (command owner cap: calibration.duty_max 0.35).
                stall_grace_s: 1.5, stall_window_s: 1.0, stall_min_progress_m: 0.02,
                stall_boost_step: 0.02, stall_boost_max_duty: 0.30,
                # kick (2026-09-24, BACKLOG #63): risabot5's static friction is far bigger than its rolling friction
                # (at 0.30 it did not start, at 0.24 it rolled once started). Every segment starts with a kick_duty
                # burst of kick_s, then falls back to raw_duty; a stall repeats the kick, kick_step stronger each
                # time up to kick_max_duty (max_kicks), only then the cruise duty is raised. The command owner caps
                # calibration duty at control.yaml command_owner.calibration.duty_max (0.50).
                kick_at_start: true, kick_duty: 0.40, kick_s: 0.5, kick_step: 0.05, kick_max_duty: 0.50, max_kicks: 6}
    pass: {straight_drift_m_per_m: 0.02, min_radius_m_max: 0.45}
  - index: 8
    id: speed_pid
    title: Speed PID
    required: true
    tab: control
    tool: ros2 run carbot_control calib_speed
    need: Step 7 passed (the car drives straight). calibrate.launch.py running. Straight clear floor, about 1.5 m free ahead AND behind, e-stop ready.
    instructions:
      - "The car drives ITSELF straight, forward and back alternately (about 1.5 m free ahead
         and behind), through the command owner (calibrate mode only). E-stop ready. Press Run."
      - "DUTY SWEEP: press Go before each step (raw duty, alternating direction; move the car
         back to the middle if needed). The steady /odom speeds fit the feedforward
         duty = static + per_mps * speed, set live on command_owner."
      - "SPEED STEPS: press Go before each closed-loop step to step_targets_mps. Steady error
         and overshoot are checked; a failing run retunes kp / ki and runs again (max_runs)."
      - Press Save. It writes the feedforward and the speed PID gains into this session.
    writes: [params_overlay command_owner.speed_pid.*, command_owner.feedforward.*, tunnel_bridge.command_owner_feedforward.*]
    # phase 8 page: stop_settle_s = speed-0 requests after each step (as calib_drive);
    # odom_timeout_s = /odom older than this while driving aborts the run.
    procedure: {sweep_duties: [0.06, 0.08, 0.10, 0.12, 0.15, 0.18, 0.22], step_targets_mps: [0.03, 0.075, 0.15], hold_s: 3.0, steady_s: 1.0, max_runs: 3,
                stop_settle_s: 0.8, odom_timeout_s: 0.5}
    pass: {max_steady_error_mps: 0.01, max_overshoot_pct: 20.0, min_creep_speed_mps: 0.03}
  # Step 9 (wizard page, phase 8): measures the venue road / tape colours from what road_perception
  # already publishes (road grid + its stitched debug image, no raw camera images in the wizard) and
  # proposes road_perception.classify.* (V4 rule: ROAD luma < road_max_luma and chroma <
  # road_max_chroma, else PAINT luma > paint_min_luma). "Apply live" sets them on road_perception
  # (ROS parameters) before Save writes params_overlay. bpu_detector.thresholds.* are detector
  # confidences, not colours: the page leaves them unchanged (Detections / Tuning tab, BACKLOG #15/#16).
  - index: 9
    id: venue_thresholds
    title: Venue colour / lighting thresholds
    required: true
    tab: perception
    writes: [params_overlay road_perception.classify.*, bpu_detector.thresholds.*]
    need: Steps 3 and 4 saved (the road grid uses the camera calibration). Venue lights on as in the race.
    instructions:
      - "OPEN ROAD: put the car in the middle of a straight lane, lights as in the race. The sample box
         on the map (just ahead of the car) must hold only bare road; both lane lines in view beside it."
      - Press Sample open road and keep everyone out of the picture for a few seconds.
      - "TUNNEL: push the car into the tunnel, turned so the tunnel box on the map lies on the tunnel
         floor (no tape), and press Sample tunnel."
      - Check the proposed values and the before / after numbers, then press Apply live and look at the
        Perception tab (road green, tape cream, no cream blobs on bare road).
      - Press Save. It writes the values into this session's params_overlay.yaml.
    # Sample boxes are in base_link (rear-axle centre on the ground). The front camera (Astra,
    # CAD mount) sees the floor from x ~0.47 m; lane width 0.30 m -> half_width 0.08 m keeps the
    # tape out of the box with ~5 cm of slack. The tunnel is a curve (r 0.75 m), so its box is short.
    procedure: {sample_s: 4.0,              # sampling time per box
                min_frames: 8,              # stitched frames needed per sample
                frame_timeout_s: 15.0,      # give up when min_frames have not arrived by then
                roi: {x_min_m: 0.50, x_max_m: 0.80, half_width_m: 0.08},
                tunnel_roi: {x_min_m: 0.48, x_max_m: 0.62, half_width_m: 0.06},
                min_roi_cells: 40,          # box cells seen per frame
                road_percentile: 99.0,      # the road's bright end = this percentile of box luma / chroma
                luma_margin: 10,            # road_max_luma = road bright end + this
                chroma_margin: 8,           # road_max_chroma = road chroma end + this
                paint_gap: 25,              # tape candidates: seen cells outside the box brighter than road end + this
                paint_percentile: 10.0,     # the tape's dark end
                min_paint_cells: 20,        # tape cells per frame for a tape measurement (open road must have it)
                min_paint_margin: 15,       # paint_min_luma at least this above the road's bright end
                tunnel_min_luma: 12,        # tunnel box darker than this = the camera sees nothing
                min_decode_agreement: 0.9,  # decoded stitched colours must reproduce road_perception's kinds
                param_timeout_s: 3.0}       # road_perception parameter get / set
    pass: {min_road_coverage: 0.5, max_false_paint_ratio: 0.05, tunnel_dark_check: true}
  - index: 10
    id: uwb_survey
    title: UWB anchor survey + uwb_calib offsets
    required: true
    tab: localization
    tool: ros2 run uwb_localization calib_uwb
    writes: [uwb.yaml anchors, uwb.yaml tag.z_m, uwb.yaml tag.mount_xy_m, uwb.yaml anchors_surveyed,
             uwb.yaml offsets_calibrated]
    need: Step 1 passed (UWB tag and every anchor seen). Tape measure; the tag on the car or on a stand.
    # Wizard page (phase 8, page 10): RUN argument JSON {"stage": "link" | "survey" | "offsets" |
    # "verify", ...}; one stage per Run, the step passes once all four passed. Same math as
    # calib_uwb (raw tag JSON, offset = median(raw 3-D range) - tape 3-D distance).
    instructions:
      - "LAYOUT: spread the anchors 2-7 m apart in a triangle around the track (current
         layout: 1782 (0, 0), 1786 (7.50, 0), 1783 (7.50, 4.83), metres). Never nearly in a line."
      - "HEIGHT: raise every anchor to 1.0-1.5 m on a stand with clear line of sight to the whole
         track. Anchors on the floor cause the ~25 cm flip-flop seen in testing."
      - "4th ANCHOR (optional, covers the corner at (0, 4.83) outside the triangle): add its ID to
         ANCHOR_IDS and set ANCHOR_COUNT 4 in firmware/uwb_tag/TagMicroROS/RangeProtocol.h,
         re-flash the tag, then add it when the tool asks for anchors."
      - "SURVEY: tape-measure every anchor antenna (x, y, height) in METRES from anchor 1782,
         +x towards 1786, +y from 1786 towards 1783. Enter them on this page (the terminal tool asks for them)."
      - "TAG: measure the tag antenna on the car: height above the floor, and its position from
         the rear-axle centre (forward +x, left +y)."
      - "OFFSETS: put the tag still at a tape-measured spot inside the triangle, more than 1 m from
         every anchor, antenna as on the car, nobody in the line of sight (20 s)."
      - "VERIFY: move it to a DIFFERENT measured spot (20 s). The corrected fix must be within 15 cm."
    procedure: {tool: tools/uwb/uwb_calib.py method (calib_uwb), seconds: 20, min_distance_from_anchor_m: 1.0,
                verify_spot: true, link_check_s: 5, min_samples: 20, min_spacing_m: 2.0,
                min_triangle_angle_deg: 25.0, hdop_limit: 2.0, max_spread_m: 0.08,
                # wizard page only (phase 8)
                min_verify_separation_m: 0.5, min_fixes: 10, max_extent_m: 30.0}
    pass: {max_verify_error_m: 0.15, all_anchors_seen: true, min_hdop_coverage: 0.9}
  - index: 11
    id: map_uwb_alignment
    title: Map-to-UWB alignment lap
    required: true
    tab: map
    tool: ros2 run carbot_localization calib_map_uwb
    writes: [uwb.yaml track_to_venue]
    instructions:
      - Needs steps 4, 6 and 10 done (block 05 must hold the lane; UWB offsets applied).
      - "LAP (best): put the car on the map start pose (bottom-right lane, facing west), press
         Start lap (terminal: Enter), then push or drive it SLOWLY once around the whole track and
         press Stop lap (Enter)."
      - "POINTS (quick, competition day): park the car on 2 or more known map poses far apart
         (start, traffic-light stop, ...) for 10 s each."
      - The fit uses every range directly; check the RMS and that the planned route overlays the
        track on the Global map tab.
    procedure: {drive: slow_manual_lap, mode: calibrate_only, modes: [lap, points], lap_min_s: 40,
                min_extent_m: 3.0, huber_m: 0.10, inlier_m: 0.25, points_seconds: 10, min_points: 2,
                # wizard page (phase 8 page 11); the terminal tool ignores these
                points_min_extent_m: 1.5,     # points mode: poses must span this (was hard-coded in calib_map_uwb)
                lap_max_s: 300,               # lap recording ends by itself after this
                max_input_age_s: 1.0,         # /odom and /imu/rpy older than this = lap refused / failed
                live_fit_period_s: 2.0,       # running fit shown while the lap is recorded
                overlay_max_points: 400}      # fixes / path points sent to the GUI map overlay
    pass: {max_rms_m: 0.20, min_inlier_frac: 0.8}
  # phase 8: step 12 inserted (agreed 13-step wizard). Routes and roundabout exits are planned
  # on the saved map. Page 12 built: required (BACKLOG #20).
  - index: 12
    id: mission_planner
    title: Mission planner (route + roundabout exits)
    required: true
    tab: map
    tool: python3 tools/map/mission_planner.py
    writes: [mission.yaml]
    instructions:
      - Needs step 11 saved. Routes and roundabout exits are planned on that exact map.
      - Place P0 (start), P1, P2 (parking) and P3 (finish); every car pose must be fully on the road.
      - Check all routes and their roundabout exits, then save the mission.
    # Wizard page (phase 8 page 12): runs tools/map/mission_planner.py (imported, not copied) on
    # <session>/data/track_map.yaml, else the repo track_map.yaml, and writes
    # <session>/data/mission.yaml (records map.file + map.sha1 it was planned on).
    need: "Step 11 saved (the map this session races on). Planning takes about a minute per leg on the car."
    procedure:
      planner_dir: tools/map        # mission_planner.py + map_builder.py; relative = in the repo checkout ($CARBOT_REPO)
      legs: 3                       # P0 -> P1 -> P2 -> P3 (= mission_planner.py LEGS)
      track_step_m: 0.05            # map drawing: centreline sample spacing (GUI only)
      route_step_m: 0.03            # route drawing: point spacing (GUI only; mission.yaml keeps the planner's)
      snap: true                    # page default: clicks snap to the lane centre / centre of a bay
    pass:
      min_pose_margin_m: 0.0        # car body must stay this far inside the road at every pose (= mission_planner.py FIT_PAD_M)
      block07_check: true           # also run the race-time global planner check (exits vs mission_rules.yaml roundabout_visits)
  # Step 13 (phase 8 page 13, optional). The page NEVER commands motion: the car drives through
  # the normal stack. One Run = one attempt at one challenge (RUN argument JSON
  # {"op": "start", "challenge": N}); it watches /carbot/mission/state + /carbot/mission/events
  # (+ /carbot/manual/takeover, /carbot/race/armed) and ends on its own when the mission leaves
  # the challenge, completes, or a manual intervention is seen, else on Stop / STOP MOTORS or
  # procedure.max_attempt_s. The user grades each attempt ({"op": "grade", ...}); the scoreboard
  # node is not launched, so nothing is graded automatically except manual intervention = FAIL.
  # PASS = the user pressed Practice done ({"op": "done"}), failed attempts included.
  # Save also writes practice/summary.yaml next to the per-challenge files.
  - index: 13
    id: practice_runs
    title: Per-challenge practice runs (optional)
    required: false
    tab: scoreboard
    writes: [practice/<challenge>.yaml]
    need: Every required step saved (Run stays refused until then). Mission planned (step 12), clear track, e-stop ready.
    instructions:
      - Pick a challenge and put the car where that challenge starts.
      - "Press Start attempt, then let the car drive it through the normal stack (this page never drives)."
      - "The attempt ends by itself when the mission leaves the challenge, finishes, or sees a manual
         intervention; or press Stop attempt (STOP MOTORS also stops it)."
      - Grade the attempt (Excellent / Completed / Partial / Fail) and add a note if useful.
      - Repeat for any challenge you want to practise, then press Practice done and Save.
    procedure: {max_attempt_s: 300.0,         # an attempt still running after this ends as TIME_LIMIT
                end_on_challenge_exit: true,   # end when MissionState.challenge_id leaves the challenge
                max_events: 60,                # mission events kept per attempt
                max_transitions: 60,           # mission mode / challenge / hold changes kept per attempt
                recent_attempts: 12}           # attempts listed on the page
    pass: {user_marked_done: true}
