# RDK X5 BPU compilation configuration for risabot YOLOv5s model
model_parameters:
  onnx_model: './best.onnx'
  march: 'bayes-e'              # RDK X5 BPU architecture (Bayes-E)
  layer_out_dump: False
  working_dir: 'model_output'
  output_model_file_prefix: 'risabot_signs_640x640_nv12'

input_parameters:
  input_name: 'images'
  input_type_rt: 'nv12'          # MIPI camera native format (zero-copy BPU input)
  input_type_train: 'rgb'
  input_layout_train: 'NCHW'
  input_shape: '1x3x640x640'
  norm_type: 'data_scale'
  scale_value: 0.003921568627451  # 1/255

calibration_parameters:
  cal_data_dir: './calibration_data'
  cal_data_type: 'uint8'         # Must match our generated calibration uint8 binary files
  calibration_type: 'default'

compiler_parameters:
  compile_mode: 'latency'
  optimize_level: 'O3'
  debug: False
