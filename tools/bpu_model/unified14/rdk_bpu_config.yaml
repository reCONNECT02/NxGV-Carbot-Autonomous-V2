# hb_mapper makertbin config: unified14 YOLO11n for the RDK X5 BPU (Bayes-E).
# Same pattern as the base repo's tools/bpu_model/risabot_bpu_config.yaml.
model_parameters:
  onnx_model: './best_rdk.onnx'
  march: 'bayes-e'
  layer_out_dump: False
  working_dir: 'model_output'
  output_model_file_prefix: 'unified14_yolo11n_640x640_nv12'
input_parameters:
  input_name: 'images'           # Ultralytics ONNX input name
  input_type_rt: 'nv12'          # bpu_detector feeds NV12
  input_type_train: 'rgb'
  input_layout_train: 'NCHW'
  input_shape: '1x3x640x640'
  norm_type: 'data_scale'
  scale_value: 0.003921568627451 # 1/255
calibration_parameters:
  cal_data_dir: './calibration_data'
  cal_data_type: 'uint8'
  calibration_type: 'default'
compiler_parameters:
  compile_mode: 'latency'
  optimize_level: 'O3'
  debug: False
